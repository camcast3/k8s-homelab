---
# =============================================================================
# Section 1: Clean up Proxmox Boot Order
# =============================================================================
- name: Clean up Proxmox Boot Order
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/vault.yml
  vars:
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') | default('192.168.86.2', true) }}"
    proxmox_api_user: "{{ lookup('env', 'PROXMOX_API_USER') | default('opentofu-prov@pve', true) }}"
    proxmox_api_token_name: "opentofutokenPVE"
    proxmox_api_token_value: "{{ vault_proxmox_api_token_secret }}"
    proxmox_node: "pvebeast"

  tasks:
    - name: Load inventory to get VMIDs
      set_fact:
        all_vmids: "{{ groups['talos_control_plane'] | map('extract', hostvars, 'vmid') | list + groups['talos_workers'] | map('extract', hostvars, 'vmid') | list }}"

    - name: Get current boot order for all VMs
      uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ item }}/config"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_name }}={{ proxmox_api_token_value }}"
        validate_certs: false
      register: vm_configs
      loop: "{{ all_vmids }}"

    - name: Display current boot orders
      debug:
        msg: "VM {{ item.item }} boot order: {{ item.json.data.boot }}"
      loop: "{{ vm_configs.results }}"

    - name: Change VM boot order to scsi0 only (remove ide2)
      uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ item }}/config"
        method: PUT
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_name }}={{ proxmox_api_token_value }}"
        body_format: form-urlencoded
        body:
          boot: "order=scsi0"
        validate_certs: false
      register: boot_order_change
      loop: "{{ all_vmids }}"

    - name: Display boot order change results
      debug:
        msg: "VM {{ item.item }} boot order updated successfully"
      loop: "{{ boot_order_change.results }}"
      when: item.status == 200

    - name: Reboot all VMs to apply boot order changes
      uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ item }}/status/reboot"
        method: POST
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_name }}={{ proxmox_api_token_value }}"
        validate_certs: false
      register: reboot_result
      loop: "{{ all_vmids }}"

    - name: Wait for VMs to start rebooting
      pause:
        seconds: 300

    - name: Wait for VMs to come back online
      uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ item }}/status/current"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_name }}={{ proxmox_api_token_value }}"
        validate_certs: false
      register: vm_status
      until: vm_status.json.data.status == "running"
      retries: 30
      delay: 10
      loop: "{{ all_vmids }}"

    - name: Display VM status after reboot
      debug:
        msg: "VM {{ item.item }} is {{ item.json.data.status }}"
      loop: "{{ vm_status.results }}"

# =============================================================================
# Section 2: Discover and Map Talos VM IPs
# =============================================================================
- name: Discover and Map Talos VM IPs
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/vault.yml
  vars:
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') | default('192.168.86.2', true) }}"
    proxmox_api_user: "{{ lookup('env', 'PROXMOX_API_USER') | default('opentofu-prov@pve', true) }}"
    proxmox_api_token_name: "opentofutokenPVE"
    proxmox_api_token_value: "{{ vault_proxmox_api_token_secret }}"
    proxmox_node: "pvebeast"

  tasks:
    - name: Build control plane IP map from inventory
      set_fact:
        control_plane_ip_map: >-
          {{
            groups['talos_control_plane'] | map('extract', hostvars) | 
            map(attribute='inventory_hostname') |
            map('extract', hostvars) |
            list |
            map('dict2items') |
            map('items2dict') |
            list
          }}

    - name: Simplify control plane IP map
      set_fact:
        control_plane_ip_map: >-
          {{
            groups['talos_control_plane'] | map('extract', hostvars) |
            map('combine', {'name': item}) |
            list
          }}
      loop: "{{ groups['talos_control_plane'] }}"
      when: false  # Skip this, use simpler approach below

    - name: Create control plane IP map from inventory
      set_fact:
        control_plane_ip_map: []

    - name: Build control plane IP map
      set_fact:
        control_plane_ip_map: >-
          {{
            control_plane_ip_map + [{
              'name': item,
              'vmid': hostvars[item].vmid,
              'expected_ip': hostvars[item].expected_ip,
              'actual_ip': hostvars[item].actual_ip,
              'mac': hostvars[item].mac_address
            }]
          }}
      loop: "{{ groups['talos_control_plane'] }}"

    - name: Create worker IP map from inventory
      set_fact:
        worker_ip_map: []

    - name: Build worker IP map
      set_fact:
        worker_ip_map: >-
          {{
            worker_ip_map + [{
              'name': item,
              'vmid': hostvars[item].vmid,
              'expected_ip': hostvars[item].expected_ip,
              'actual_ip': hostvars[item].actual_ip,
              'mac': hostvars[item].mac_address
            }]
          }}
      loop: "{{ groups['talos_workers'] }}"

    - name: Get actual IPs from Proxmox for control plane nodes (verification)
      uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ item.vmid }}/agent/network-get-interfaces"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_name }}={{ proxmox_api_token_value }}"
        validate_certs: false
      register: control_actual_ips_verify
      loop: "{{ control_plane_ip_map }}"
      retries: 10
      delay: 30
      until: control_actual_ips_verify.status == 200

    - name: Get actual IPs from Proxmox for worker nodes (verification)
      uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ item.vmid }}/agent/network-get-interfaces"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_name }}={{ proxmox_api_token_value }}"
        validate_certs: false
      register: worker_actual_ips_verify
      loop: "{{ worker_ip_map }}"
      retries: 10
      delay: 30
      until: worker_actual_ips_verify.status == 200

    - name: Extract control plane current IPs from Proxmox
      set_fact:
        control_plane_current_ips: []

    - name: Build control plane current IPs list
      set_fact:
        control_plane_current_ips: >-
          {{
            control_plane_current_ips + [
              (item.json.data.result | 
               selectattr('name', 'equalto', 'ens18') | 
               map(attribute='ip-addresses') | 
               first | 
               selectattr('ip-address-type', 'equalto', 'ipv4') | 
               map(attribute='ip-address') | 
               first) | default(item.item.actual_ip)
            ]
          }}
      loop: "{{ control_actual_ips_verify.results }}"

    - name: Extract worker current IPs from Proxmox
      set_fact:
        worker_current_ips: []

    - name: Build worker current IPs list
      set_fact:
        worker_current_ips: >-
          {{
            worker_current_ips + [
              (item.json.data.result | 
               selectattr('name', 'equalto', 'ens18') | 
               map(attribute='ip-addresses') | 
               first | 
               selectattr('ip-address-type', 'equalto', 'ipv4') | 
               map(attribute='ip-address') | 
               first) | default(item.item.actual_ip)
            ]
          }}
      loop: "{{ worker_actual_ips_verify.results }}"

    - name: Update control plane IP map with live Proxmox data
      set_fact:
        control_plane_ip_map_updated: []

    - name: Build updated control plane IP map
      set_fact:
        control_plane_ip_map_updated: >-
          {{
            control_plane_ip_map_updated + [
              item.0 | combine({'current_ip': item.1})
            ]
          }}
      loop: "{{ control_plane_ip_map | zip(control_plane_current_ips) | list }}"

    - name: Replace control plane IP map
      set_fact:
        control_plane_ip_map: "{{ control_plane_ip_map_updated }}"

    - name: Update worker IP map with live Proxmox data
      set_fact:
        worker_ip_map_updated: []

    - name: Build updated worker IP map
      set_fact:
        worker_ip_map_updated: >-
          {{
            worker_ip_map_updated + [
              item.0 | combine({'current_ip': item.1})
            ]
          }}
      loop: "{{ worker_ip_map | zip(worker_current_ips) | list }}"

    - name: Replace worker IP map
      set_fact:
        worker_ip_map: "{{ worker_ip_map_updated }}"

    - name: Display IP mapping with live data from Proxmox
      debug:
        msg: |
          Control Plane IP Mapping (live from Proxmox):
          {% for node in control_plane_ip_map %}
          - {{ node.name }} (VMID: {{ node.vmid }}): 
            Current IP: {{ node.current_ip }}
            Expected IP: {{ node.expected_ip }}
            Status: {{ 'Already Configured' if node.current_ip == node.expected_ip else 'Needs Configuration' }}
          {% endfor %}
          
          Worker IP Mapping (live from Proxmox):
          {% for node in worker_ip_map %}
          - {{ node.name }} (VMID: {{ node.vmid }}): 
            Current IP: {{ node.current_ip }}
            Expected IP: {{ node.expected_ip }}
            Status: {{ 'Already Configured' if node.current_ip == node.expected_ip else 'Needs Configuration' }}
          {% endfor %}

    - name: Save IP mappings for next playbook section
      set_fact:
        all_nodes_map: "{{ control_plane_ip_map + worker_ip_map }}"
        cacheable: true

    - name: Verify IPs are discoverable
      assert:
        that:
          - control_plane_ip_map | length > 0
          - worker_ip_map | length > 0
          - control_plane_ip_map | selectattr('actual_ip', 'equalto', '') | list | length == 0
          - worker_ip_map | selectattr('actual_ip', 'equalto', '') | list | length == 0
        fail_msg: "Failed to load VM IPs from inventory. Check hosts.yml file."
        success_msg: "All VM IPs loaded successfully from inventory"

# =============================================================================
# Section 3: Bootstrap TalosOS Nodes
# =============================================================================
- name: Bootstrap TalosOS Nodes
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../group_vars/all/vault.yml
  vars:
    # Pull from inventory vars instead of hardcoding
    cluster_name: "{{ hostvars['localhost']['cluster_name'] | default('test') }}"
    cluster_vip: "{{ hostvars['localhost']['cluster_vip'] | default('192.168.86.100') }}"
    gateway: "{{ hostvars['localhost']['gateway'] | default('192.168.86.1') }}"
    nameservers: "{{ hostvars['localhost']['nameservers'] | default(['192.168.25.19']) }}"
    kubernetes_version: "v{{ hostvars['localhost']['kubernetes_version'] | default('1.33.6') }}"
    talos_version: "{{ hostvars['localhost']['talos_version'] | default('v1.11.5') }}"
    qemu_installer_image: "factory.talos.dev/installer/ce4c980550dd2ab1b17bbf2b08801c7eb59418eafe8f279833297925d67c7515:{{ talos_version }}"
    config_dir: "/home/cameron/repos/k8_homelab/talos/{{ cluster_name }}-config"
    template_dir: "/home/cameron/repos/k8_homelab/ansible/templates"
    patch_dir: "/home/cameron/repos/k8_homelab/ansible/patches"
    proxmox_host: "{{ lookup('env', 'PROXMOX_HOST') | default('192.168.86.2', true) }}"
    proxmox_api_user: "{{ lookup('env', 'PROXMOX_API_USER') | default('opentofu-prov@pve', true) }}"
    proxmox_api_token_name: "opentofutokenPVE"
    proxmox_api_token_value: "{{ vault_proxmox_api_token_secret }}"
    proxmox_node: "pvebeast"

  tasks:
    - name: Load IP mappings from previous play
      set_fact:
        control_plane_ip_map: "{{ hostvars['localhost']['control_plane_ip_map'] }}"
        worker_ip_map: "{{ hostvars['localhost']['worker_ip_map'] }}"

    - name: Create Talos config directory
      file:
        path: "{{ config_dir }}"
        state: directory
        mode: '0755'

    - name: Create patches directory
      file:
        path: "{{ patch_dir }}"
        state: directory
        mode: '0755'

    - name: Check if Talos config already exists
      stat:
        path: "{{ config_dir }}/talosconfig"
      register: talos_config_exists

    - name: Generate Talos machine configurations with QEMU guest agent installer
      command: >
        talosctl gen config {{ cluster_name }} https://{{ cluster_vip }}:6443
        --output-dir {{ config_dir }}
        --kubernetes-version {{ kubernetes_version }}
        --talos-version {{ talos_version }}
        --install-image {{ qemu_installer_image }}
      when: not talos_config_exists.stat.exists

    # TODO: enable kubelet certificate rotation https://docs.siderolabs.com/kubernetes-guides/monitoring-and-observability/deploy-metrics-server#node-configuration
    - name: Create control plane patch files with expected IPs
      template:
        src: "{{ template_dir }}/controlplane-patch.yaml.j2"
        dest: "{{ patch_dir }}/controlplane-{{ item.name }}-patch.yaml"
      vars:
        node_ip: "{{ item.expected_ip }}"
        node_name: "{{ item.name }}"
        patch_cluster_vip: "{{ cluster_vip }}"
        patch_gateway: "{{ gateway }}"
        patch_nameservers: "{{ nameservers }}"
        patch_control_plane_ip_map: "{{ control_plane_ip_map }}"
      loop: "{{ control_plane_ip_map }}"
    
    # TODO: enable kubelet certificate rotation https://docs.siderolabs.com/kubernetes-guides/monitoring-and-observability/deploy-metrics-server#node-configuration
    - name: Create worker patch files with expected IPs
      template:
        src: "{{ template_dir }}/worker-patch.yaml.j2"
        dest: "{{ patch_dir }}/worker-{{ item.name }}-patch.yaml"
      vars:
        node_ip: "{{ item.expected_ip }}"
        node_name: "{{ item.name }}"
        patch_gateway: "{{ gateway }}"
        patch_nameservers: "{{ nameservers }}"
      loop: "{{ worker_ip_map }}"

    - name: Wait for guest agent to refresh after reboot
      pause:
        seconds: 30
        prompt: "Waiting for guest agent to update IP information..."

    - name: Re-query Proxmox for updated control plane IPs
      uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ item.vmid }}/agent/network-get-interfaces"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_name }}={{ proxmox_api_token_value }}"
        validate_certs: false
      register: control_actual_ips_refresh
      loop: "{{ control_plane_ip_map }}"
      retries: 5
      delay: 5
      until: control_actual_ips_refresh.status == 200

    - name: Re-query Proxmox for updated worker IPs
      uri:
        url: "https://{{ proxmox_host }}:8006/api2/json/nodes/{{ proxmox_node }}/qemu/{{ item.vmid }}/agent/network-get-interfaces"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ proxmox_api_user }}!{{ proxmox_api_token_name }}={{ proxmox_api_token_value }}"
        validate_certs: false
      register: worker_actual_ips_refresh
      loop: "{{ worker_ip_map }}"
      retries: 5
      delay: 5
      until: worker_actual_ips_refresh.status == 200

    - name: Rebuild control plane current IPs list with fresh data
      set_fact:
        control_plane_current_ips_fresh: []

    - name: Build refreshed control plane current IPs list
      set_fact:
        control_plane_current_ips_fresh: >-
          {{
            control_plane_current_ips_fresh + [
              (item.json.data.result | 
               selectattr('name', 'equalto', 'ens18') | 
               map(attribute='ip-addresses') | 
               first | 
               selectattr('ip-address-type', 'equalto', 'ipv4') | 
               map(attribute='ip-address') | 
               first) | default(item.item.actual_ip)
            ]
          }}
      loop: "{{ control_actual_ips_refresh.results }}"

    - name: Rebuild worker current IPs list with fresh data
      set_fact:
        worker_current_ips_fresh: []

    - name: Build refreshed worker current IPs list
      set_fact:
        worker_current_ips_fresh: >-
          {{
            worker_current_ips_fresh + [
              (item.json.data.result | 
               selectattr('name', 'equalto', 'ens18') | 
               map(attribute='ip-addresses') | 
               first | 
               selectattr('ip-address-type', 'equalto', 'ipv4') | 
               map(attribute='ip-address') | 
               first) | default(item.item.actual_ip)
            ]
          }}
      loop: "{{ worker_actual_ips_refresh.results }}"

    - name: Update control plane IP map with refreshed Proxmox data
      set_fact:
        control_plane_ip_map_refreshed: []

    - name: Build refreshed control plane IP map
      set_fact:
        control_plane_ip_map_refreshed: >-
          {{
            control_plane_ip_map_refreshed + [
              item.0 | combine({'current_ip': item.1})
            ]
          }}
      loop: "{{ control_plane_ip_map | zip(control_plane_current_ips_fresh) | list }}"

    - name: Replace control plane IP map with refreshed data
      set_fact:
        control_plane_ip_map: "{{ control_plane_ip_map_refreshed }}"

    - name: Update worker IP map with refreshed Proxmox data
      set_fact:
        worker_ip_map_refreshed: []

    - name: Build refreshed worker IP map
      set_fact:
        worker_ip_map_refreshed: >-
          {{
            worker_ip_map_refreshed + [
              item.0 | combine({'current_ip': item.1})
            ]
          }}
      loop: "{{ worker_ip_map | zip(worker_current_ips_fresh) | list }}"

    - name: Replace worker IP map with refreshed data
      set_fact:
        worker_ip_map: "{{ worker_ip_map_refreshed }}"

    - name: Display generated patches for review
      debug:
        msg: |
          Generated patches:
          Control Plane Patches:
          {% for node in control_plane_ip_map %}
          - {{ patch_dir }}/controlplane-{{ node.name }}-patch.yaml (IP: {{ node.expected_ip }})
          {% endfor %}
          Worker Patches:
          {% for node in worker_ip_map %}
          - {{ patch_dir }}/worker-{{ node.name }}-patch.yaml (IP: {{ node.expected_ip }})
          {% endfor %}

    - name: Build control plane connection strategy based on Proxmox data
      set_fact:
        control_plane_strategy: []

    - name: Add each control plane node to strategy
      set_fact:
        control_plane_strategy: >-
          {{
            control_plane_strategy + [{
              'name': item.name,
              'expected_ip': item.expected_ip,
              'current_ip': item.current_ip,
              'at_expected': item.current_ip == item.expected_ip,
              'needs_config': item.current_ip != item.expected_ip
            }]
          }}
      loop: "{{ control_plane_ip_map }}"

    - name: Build worker connection strategy based on Proxmox data
      set_fact:
        worker_strategy: []

    - name: Add each worker node to strategy
      set_fact:
        worker_strategy: >-
          {{
            worker_strategy + [{
              'name': item.name,
              'expected_ip': item.expected_ip,
              'current_ip': item.current_ip,
              'at_expected': item.current_ip == item.expected_ip,
              'needs_config': item.current_ip != item.expected_ip
            }]
          }}
      loop: "{{ worker_ip_map }}"

    - name: Display connection strategy
      debug:
        msg: |
          Node Connection Strategy:
          Control Plane:
          {% for node in control_plane_strategy %}
          - {{ node.name }}: {{ 'Already at ' + node.expected_ip if node.at_expected else 'At ' + node.current_ip + ', will apply config to move to ' + node.expected_ip }}
          {% endfor %}
          Workers:
          {% for node in worker_strategy %}
          - {{ node.name }}: {{ 'Already at ' + node.expected_ip if node.at_expected else 'At ' + node.current_ip + ', will apply config to move to ' + node.expected_ip }}
          {% endfor %}

    - name: Check if nodes at expected IPs are responsive (detect reset scenarios)
      command: >
        talosctl --talosconfig {{ config_dir }}/talosconfig
        --nodes {{ item.expected_ip }}
        version
      loop: "{{ control_plane_strategy + worker_strategy }}"
      when: item.at_expected
      register: node_responsive_check
      failed_when: false
      changed_when: false

    - name: Build responsive nodes list
      set_fact:
        responsive_nodes: >-
          {{
            node_responsive_check.results |
            selectattr('rc', 'defined') |
            selectattr('rc', 'equalto', 0) |
            map(attribute='item.name') |
            list
          }}

    - name: Initialize updated control plane strategy
      set_fact:
        control_plane_strategy_updated: []

    - name: Build updated control plane strategy with responsiveness
      set_fact:
        control_plane_strategy_updated: >-
          {{
            control_plane_strategy_updated + [{
              'name': item.name,
              'expected_ip': item.expected_ip,
              'current_ip': item.current_ip,
              'at_expected': item.at_expected,
              'responsive': (item.at_expected and item.name in responsive_nodes) | default(false),
              'needs_config': (not item.at_expected) or (item.at_expected and item.name not in responsive_nodes)
            }]
          }}
      loop: "{{ control_plane_strategy }}"

    - name: Replace control plane strategy
      set_fact:
        control_plane_strategy: "{{ control_plane_strategy_updated }}"

    - name: Initialize updated worker strategy
      set_fact:
        worker_strategy_updated: []

    - name: Build updated worker strategy with responsiveness
      set_fact:
        worker_strategy_updated: >-
          {{
            worker_strategy_updated + [{
              'name': item.name,
              'expected_ip': item.expected_ip,
              'current_ip': item.current_ip,
              'at_expected': item.at_expected,
              'responsive': (item.at_expected and item.name in responsive_nodes) | default(false),
              'needs_config': (not item.at_expected) or (item.at_expected and item.name not in responsive_nodes)
            }]
          }}
      loop: "{{ worker_strategy }}"

    - name: Replace worker strategy
      set_fact:
        worker_strategy: "{{ worker_strategy_updated }}"

    - name: Display updated strategy after responsiveness check
      debug:
        msg: |
          Updated Node Strategy:
          Control Plane:
          {% for node in control_plane_strategy %}
          - {{ node.name }}: {{ 'Responsive at ' + node.expected_ip + ' (skip config)' if (node.at_expected and node.responsive | default(true)) else ('Unresponsive at ' + node.expected_ip + ' (needs reconfig)' if node.at_expected else 'At ' + node.current_ip + ' (needs config)') }}
          {% endfor %}
          Workers:
          {% for node in worker_strategy %}
          - {{ node.name }}: {{ 'Responsive at ' + node.expected_ip + ' (skip config)' if (node.at_expected and node.responsive | default(true)) else ('Unresponsive at ' + node.expected_ip + ' (needs reconfig)' if node.at_expected else 'At ' + node.current_ip + ' (needs config)') }}
          {% endfor %}

    - name: Apply configuration to control plane nodes (only nodes needing config)
      command: >
        talosctl --talosconfig {{ config_dir }}/talosconfig
        --nodes {{ item.at_expected | ternary(item.expected_ip, item.current_ip) }}
        apply-config
        --file {{ config_dir }}/controlplane.yaml
        --config-patch @{{ patch_dir }}/controlplane-{{ item.name }}-patch.yaml
        {{ '--insecure' if not item.at_expected else '' }}
      loop: "{{ control_plane_strategy }}"
      when: item.needs_config
      register: control_apply_result

    - name: Wait for control plane nodes to come up at expected IPs
      wait_for:
        host: "{{ item.item.expected_ip }}"
        port: 50000
        timeout: 300
        delay: 30
        state: started
      loop: "{{ control_apply_result.results }}"
      register: control_port_check
      ignore_errors: true

    - name: Fallback to ping check for control plane nodes if port check failed
      command: ping -c 3 -W 2 {{ item.item.item.expected_ip }}
      loop: "{{ control_port_check.results }}"
      when: item.failed | default(false)
      retries: 10
      delay: 10
      until: control_ping.rc == 0
      register: control_ping

    - name: Apply configuration to worker nodes (only nodes needing config)
      command: >
        talosctl --talosconfig {{ config_dir }}/talosconfig
        --nodes {{ item.at_expected | ternary(item.expected_ip, item.current_ip) }}
        apply-config
        --file {{ config_dir }}/worker.yaml
        --config-patch @{{ patch_dir }}/worker-{{ item.name }}-patch.yaml
        {{ '--insecure' if not item.at_expected else '' }}
      loop: "{{ worker_strategy }}"
      when: item.needs_config
      register: worker_apply_result

    - name: Wait for worker nodes to come up at expected IPs
      wait_for:
        host: "{{ item.item.expected_ip }}"
        port: 50000
        timeout: 300
        delay: 30
        state: started
      loop: "{{ worker_apply_result.results }}"
      register: worker_port_check
      ignore_errors: true

    - name: Fallback to ping check for worker nodes if port check failed
      command: ping -c 3 -W 2 {{ item.item.item.expected_ip }}
      loop: "{{ worker_port_check.results }}"
      when: item.failed | default(false)
      retries: 10
      delay: 10
      until: worker_ping.rc == 0
      register: worker_ping

    - name: Display final node status
      debug:
        msg: |
          All nodes verified and running at expected IPs:
          Control Plane:
          {% for node in control_plane_strategy %}
          ✓ {{ node.name }}: {{ node.expected_ip }} {{ '(was already configured)' if node.at_expected else '(newly configured)' }}
          {% endfor %}
          Workers:
          {% for node in worker_strategy %}
          ✓ {{ node.name }}: {{ node.expected_ip }} {{ '(was already configured)' if node.at_expected else '(newly configured)' }}
          {% endfor %}

    - name: Configure talosctl endpoints
      command: >
        talosctl --talosconfig {{ config_dir }}/talosconfig
        config endpoint {{ control_plane_strategy | map(attribute='expected_ip') | join(' ') }}

    - name: Set default talosctl node
      command: >
        talosctl --talosconfig {{ config_dir }}/talosconfig
        config node {{ control_plane_strategy[0].expected_ip }}

    - name: Check etcd member status (primary bootstrap indicator)
      command: >
        talosctl --talosconfig {{ config_dir }}/talosconfig
        --nodes {{ control_plane_strategy[0].expected_ip }}
        etcd members
      register: etcd_check
      failed_when: false
      changed_when: false

    - name: Check cluster health status
      command: >
        talosctl --talosconfig {{ config_dir }}/talosconfig
        health
        --control-plane-nodes {{ control_plane_strategy | map(attribute='expected_ip') | join(',') }}
        --wait-timeout 30s
      register: health_check
      failed_when: false
      changed_when: false

    - name: Set bootstrap_required flag based on etcd status
      set_fact:
        bootstrap_required: >-
          {{
            etcd_check.rc != 0 and
            'AlreadyExists' not in (etcd_check.stderr | default('')) and
            etcd_check.stdout | trim == ''
          }}

    - name: Display bootstrap status
      debug:
        msg: |
          Bootstrap Detection:
          ━━━━━━━━━━━━━━━━━━━━
          etcd members check RC: {{ etcd_check.rc }}
          etcd members output: {{ etcd_check.stdout | default('(empty)') | trim }}
          etcd stderr: {{ etcd_check.stderr | default('(none)') | trim }}
          Health check RC: {{ health_check.rc }}
          
          {% if not bootstrap_required %}
          ✓ Cluster is already bootstrapped (etcd has members)
          {% else %}
          ⚠️ Cluster needs to be bootstrapped
          {% endif %}

    - name: Bootstrap the Talos cluster
      command: >
        talosctl --talosconfig {{ config_dir }}/talosconfig
        bootstrap
      when: bootstrap_required | bool
      register: bootstrap_result
      failed_when: >
        bootstrap_result.rc != 0 and
        'AlreadyExists' not in bootstrap_result.stderr | default('')

    - name: Display bootstrap result
      debug:
        msg: |
          {% if bootstrap_result is changed and bootstrap_result.rc == 0 %}
          ✓ Cluster bootstrapped successfully on {{ control_plane_strategy[0].expected_ip }}
          {% elif 'AlreadyExists' in (bootstrap_result.stderr | default('')) %}
          ✓ Cluster was already bootstrapped (etcd data exists)
          {% else %}
          ✓ Bootstrap skipped - cluster already bootstrapped
          {% endif %}
      when: bootstrap_result is defined or not bootstrap_required

    - name: Wait for control plane nodes to stabilize after bootstrap
      pause:
        seconds: 300
        prompt: "Waiting for control plane nodes to stabilize after bootstrap..."
      when: bootstrap_required | bool

    - name: Check if kubeconfig already exists
      stat:
        path: "{{ config_dir }}/kubeconfig"
      register: kubeconfig_exists

    - name: Wait for Kubernetes API to be available
      wait_for:
        host: "{{ cluster_vip }}"
        port: 6443
        timeout: 300
        delay: 10

    - name: Retrieve kubeconfig
      command: >
        talosctl --talosconfig {{ config_dir }}/talosconfig
        --nodes {{ control_plane_strategy[0].expected_ip }}
        kubeconfig {{ config_dir }}/kubeconfig
      when: not kubeconfig_exists.stat.exists

    - name: Create .kube directory
      file:
        path: "~/.kube"
        state: directory
        mode: '0755'

    - name: Create .talos directory
      file:
        path: "~/.talos"
        state: directory
        mode: '0755'

    - name: Copy kubeconfig to user directory
      copy:
        src: "{{ config_dir }}/kubeconfig"
        dest: "~/.kube/config"
        mode: '0600'
        force: yes

    - name: Copy talosconfig to user directory
      copy:
        src: "{{ config_dir }}/talosconfig"
        dest: "~/.talos/config"
        mode: '0600'
        force: yes
      retries: 30
      delay: 10
      environment:
        KUBECONFIG: "{{ config_dir }}/kubeconfig"

    - name: Display cluster access info
      debug:
        msg: |
          ✓ Talos cluster bootstrapped successfully!
          
          Cluster Endpoint: https://{{ cluster_vip }}:6443
          
          Kubeconfig: {{ config_dir }}/kubeconfig (copied to ~/.kube/config)
          Talosconfig: {{ config_dir }}/talosconfig (copied to ~/.talos/config)
          
          Control Plane Nodes ({{ control_plane_ip_map | length }}):
          {% for node in control_plane_ip_map %}
          - {{ node.name }}: {{ node.expected_ip }}
          {% endfor %}
          
          Worker Nodes ({{ worker_ip_map | length }}):
          {% for node in worker_ip_map %}
          - {{ node.name }}: {{ node.expected_ip }}
          {% endfor %}
          
          Next: Install Cilium CNI

# =============================================================================
# Section 4: Install Cilium CNI
# =============================================================================
- name: Install Cilium CNI
  hosts: localhost
  gather_facts: false
  vars:
    cluster_name: "{{ hostvars['localhost']['cluster_name'] | default('test') }}"
    cluster_vip: "{{ hostvars['localhost']['cluster_vip'] | default('192.168.86.100') }}"
    config_dir: "/home/cameron/repos/k8_homelab/talos/{{ cluster_name }}-config"
    kubeconfig_path: "/home/cameron/repos/k8_homelab/talos/{{ cluster_name }}-config/kubeconfig"
    cilium_install_version: "1.18.4"
  
  tasks:
    - name: Load IP mappings from previous play
      set_fact:
        control_plane_ip_map: "{{ hostvars['localhost']['control_plane_ip_map'] | default(omit) }}"
        worker_ip_map: "{{ hostvars['localhost']['worker_ip_map'] | default(omit) }}"
        control_plane_strategy: "{{ hostvars['localhost']['control_plane_strategy'] | default(omit) }}"
      failed_when: false

    - name: Build control plane IP map from inventory if not loaded
      set_fact:
        control_plane_ip_map: >-
          {{ groups['talos_control_plane'] | map('extract', hostvars) | 
             map('dict2items') | map('selectattr', 'key', 'in', ['inventory_hostname', 'vmid', 'expected_ip', 'actual_ip', 'mac_address']) |
             map('items2dict') | list }}
      when: control_plane_ip_map is not defined or control_plane_ip_map | length == 0

    - name: Fallback - build control plane IP map simply
      block:
        - name: Initialize control plane IP map
          set_fact:
            control_plane_ip_map: []

        - name: Build control plane IP map from inventory
          set_fact:
            control_plane_ip_map: >-
              {{
                control_plane_ip_map + [{
                  'name': item,
                  'vmid': hostvars[item].vmid,
                  'expected_ip': hostvars[item].expected_ip,
                  'actual_ip': hostvars[item].actual_ip | default(hostvars[item].expected_ip),
                  'mac': hostvars[item].mac_address
                }]
              }}
          loop: "{{ groups['talos_control_plane'] }}"
      when: control_plane_ip_map is not defined or control_plane_ip_map | length == 0

    - name: Fallback - build worker IP map simply
      block:
        - name: Initialize worker IP map
          set_fact:
            worker_ip_map: []

        - name: Build worker IP map from inventory
          set_fact:
            worker_ip_map: >-
              {{
                worker_ip_map + [{
                  'name': item,
                  'vmid': hostvars[item].vmid,
                  'expected_ip': hostvars[item].expected_ip,
                  'actual_ip': hostvars[item].actual_ip | default(hostvars[item].expected_ip),
                  'mac': hostvars[item].mac_address
                }]
              }}
          loop: "{{ groups['talos_workers'] }}"
      when: worker_ip_map is not defined or worker_ip_map | length == 0

    - name: Verify IP maps are loaded
      debug:
        msg: |
          Control Plane IPs: {{ control_plane_ip_map | map(attribute='expected_ip') | list }}
          Worker IPs: {{ worker_ip_map | map(attribute='expected_ip') | list }}

    - name: Verify Cilium CLI availability
      command: which cilium
      register: cilium_check
      failed_when: false
      changed_when: false

    - name: Download and install Cilium CLI
      shell: |
        CILIUM_CLI_VERSION=$(curl -s https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt)
        CLI_ARCH=amd64
        curl -L --fail --remote-name-all https://github.com/cilium/cilium-cli/releases/download/${CILIUM_CLI_VERSION}/cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
        sha256sum --check cilium-linux-${CLI_ARCH}.tar.gz.sha256sum
        sudo tar xzvfC cilium-linux-${CLI_ARCH}.tar.gz /usr/local/bin
        rm cilium-linux-${CLI_ARCH}.tar.gz{,.sha256sum}
      when: cilium_check.rc != 0

    - name: Verify Cilium CLI installation
      command: cilium version --client
      register: cilium_version

    - name: Show Cilium CLI version
      debug:
        var: cilium_version.stdout_lines

    - name: Check if Cilium is already installed
      command: cilium status --wait=false
      register: cilium_status
      failed_when: false
      changed_when: false

    - name: Set Cilium installation status
      set_fact:
        cilium_installed: "{{ cilium_status.rc == 0 and 'Cilium' in cilium_status.stdout }}"

    - name: Display Cilium status
      debug:
        msg: |
          Cilium Status Check:
          {% if cilium_installed %}
          ✓ Cilium is already installed
          {% else %}
          ⚠️ Cilium not installed or not ready - will install
          {% endif %}

    - name: Deploy Cilium without kube-proxy
      command: >
        cilium install
        --version {{ cilium_install_version }}
        --set ipam.mode=kubernetes
        --set kubeProxyReplacement=true
        --set securityContext.capabilities.ciliumAgent="{CHOWN,KILL,NET_ADMIN,NET_RAW,IPC_LOCK,SYS_ADMIN,SYS_RESOURCE,DAC_OVERRIDE,FOWNER,SETGID,SETUID}"
        --set securityContext.capabilities.cleanCiliumState="{NET_ADMIN,SYS_ADMIN,SYS_RESOURCE}"
        --set cgroup.autoMount.enabled=false
        --set cgroup.hostRoot=/sys/fs/cgroup
        --set k8sServiceHost=localhost
        --set k8sServicePort=7445
        --set gatewayAPI.enabled=true
        --set gatewayAPI.enableAlpn=true
        --set gatewayAPI.enableAppProtocol=true
        --set l2announcements.enabled=true
        --set externalIPs.enabled=true
        --set devices=ens18
        --set hubble.enabled=true
        --set hubble.relay.enabled=true
        --set hubble.ui.enabled=true
        --set prometheus.enabled=true
        --set operator.prometheus.enabled=true
        --set hubble.metrics.enabled="{dns,drop,tcp,flow,icmp,http}"
      when: not cilium_installed
      register: cilium_install_result

    - name: Wait for Cilium to be ready
      command: cilium status --wait
      when: cilium_install_result is changed
      register: cilium_wait
      retries: 12
      delay: 10
      until: cilium_wait.rc == 0

    - name: Display Cilium installation result
      debug:
        msg: |
          {% if cilium_install_result is changed %}
          ✓ Cilium {{ cilium_install_version }} installed successfully
          {% else %}
          ✓ Cilium was already installed - skipped installation
          {% endif %}

    - name: Verify Cilium final status
      command: cilium status
      register: cilium_final_status
      changed_when: false

    - name: Apply Cilium L2 test yaml
      command: >
        kubectl apply -f /home/cameron/repos/k8_homelab/kubernetes/cilium/test.yaml

    - name: Check Cilium status
      command: cilium status --wait
      register: cilium_status

    - name: Display Cilium status
      debug:
        var: cilium_status.stdout_lines

    - name: Update controlplane security policy exemption for cilium-test-1 namespace
      command: >
        talosctl --talosconfig {{ config_dir }}/talosconfig
        patch mc
        --patch '[{"op":"add","path":"/cluster/apiServer/admissionControl/0/configuration/exemptions/namespaces/-","value":"cilium-test-1"}]'
        --nodes {{ control_plane_ip_map | map(attribute='expected_ip') | join(',') }}

    - name: Deploy test yaml for connectivity test
      command: >
        kubectl apply -f https://raw.githubusercontent.com/cilium/cilium/1.18.4/examples/kubernetes/connectivity-check/connectivity-check.yaml

    - name: Wait for echo-a pods to be ready
      command: >
        kubectl wait --for=condition=ready pod
        --selector=app=echo-a
        --namespace=cilium-test-1
        --timeout=180s
      register: echo_a_ready
      retries: 3
      delay: 10
      until: echo_a_ready.rc == 0

    - name: Wait for echo-b pods to be ready
      command: >
        kubectl wait --for=condition=ready pod
        --selector=app=echo-b
        --namespace=cilium-test-1
        --timeout=180s
      register: echo_b_ready
      retries: 3
      delay: 10
      until: echo_b_ready.rc == 0

    - name: Wait for echo-b-headless pods to be ready
      command: >
        kubectl wait --for=condition=ready pod
        --selector=app=echo-b-headless
        --namespace=cilium-test-1
        --timeout=180s
      register: echo_b_headless_ready
      retries: 3
      delay: 10
      until: echo_b_headless_ready.rc == 0

    - name: Patch service to have a port 80 on ClusterIP
      command: >
        kubectl -n cilium-test-1 patch svc echo-a-host-clusterip
        --type='json'
        -p='[{"op":"add","path":"/spec/ports","value":[{"port":80,"targetPort":8080,"protocol":"TCP"}]}]'

    - name: Display connectivity test info
      debug:
        msg: |
          ⏳ Cilium connectivity test is starting...
          
          This test performs comprehensive network validation including:
          - Pod-to-pod communication
          - Pod-to-service communication
          - External connectivity
          - Network policies
          - Load balancing
          - And more...
          
          Expected duration: 25-30 minutes (124 test scenarios)
          Please wait...

    - name: Run Cilium connectivity test
      shell: cilium connectivity test
      register: cilium_connectivity
      ignore_errors: true
      changed_when: false
      async: 1800  # 30 minutes timeout
      poll: 0

    - name: Wait for connectivity test to complete
      async_status:
        jid: "{{ cilium_connectivity.ansible_job_id }}"
      register: cilium_test_result
      until: cilium_test_result.finished
      retries: 30
      delay: 60

    - name: Display Cilium connectivity test results
      debug:
        msg: |
          Cilium Connectivity Test Results:
          {{ cilium_test_result.stdout_lines | join('\n') if cilium_test_result.rc == 0 else 'Test failed or had issues' }}

    - name: Remove cilium-test namespace and resources
      shell: kubectl delete namespace cilium-test --ignore-not-found=true
      
    - name: Revert security policy exemption on controlplane nodes
      command: >
        talosctl --talosconfig {{ config_dir }}/talosconfig
        patch mc
        --patch '[{"op":"replace","path":"/cluster/apiServer/admissionControl/0/configuration/exemptions/namespaces","value":["kube-system"]}]'
        --nodes {{ control_plane_ip_map | map(attribute='expected_ip') | join(',') }}

    - name: Display cleanup results
      debug:
        msg: |
          ✓ Cilium test resources cleaned up
          ✓ Security policy exemptions reverted to kube-system only

    - name: Display final cluster state
      debug:
        msg: |
          ✓ Cilium CNI installed successfully!

          ✓ Hubble installed successfully!

          ✓ Cilium CNI Connectivity Tested!
          
          Next: Install ArgoCD

# =============================================================================
# Section 5: Install ArgoCD using Helm
# =============================================================================
- name: Install ArgoCD using Helm
  hosts: localhost
  gather_facts: false
  vars:
    cluster_name: "{{ hostvars['localhost']['cluster_name'] | default('test') }}"
    cluster_vip: "{{ hostvars['localhost']['cluster_vip'] | default('192.168.86.100') }}"
    config_dir: "~/repos/k8_homelab/talos/{{ cluster_name }}-config"
    argocd_namespace: argocd
    argocd_version: "7.7.12"
    argocd_values_file: "~/repos/k8_homelab/ansible/values/argocd-values.yaml"

  tasks:
    - name: Create ArgoCD namespace
      command: kubectl create namespace {{ argocd_namespace }}
      register: namespace_create
      failed_when: false
      changed_when: namespace_create.rc == 0

    - name: Add ArgoCD Helm repository
      command: helm repo add argo https://argoproj.github.io/argo-helm

    - name: Update Helm repositories
      command: helm repo update

    - name: Check if ArgoCD is already installed
      command: helm list -n {{ argocd_namespace }}
      register: helm_list
      changed_when: false

    - name: Install ArgoCD using Helm
      command: >
        helm install argocd argo/argo-cd
        --namespace {{ argocd_namespace }}
        --version {{ argocd_version }}
        --values {{ argocd_values_file }}
        --wait
      when: "'argocd' not in helm_list.stdout"
      register: argocd_install

    - name: Wait for ArgoCD pods to be ready
      command: >
        kubectl wait --for=condition=ready pod
        --selector app.kubernetes.io/name=argocd-server
        --namespace {{ argocd_namespace }}
        --timeout=300s

    - name: Get ArgoCD admin password
      command: >
        kubectl get secret argocd-initial-admin-secret
        -n {{ argocd_namespace }}
        -o jsonpath="{.data.password}"
      register: argocd_password_encoded

    - name: Decode ArgoCD admin password
      set_fact:
        argocd_admin_password: "{{ argocd_password_encoded.stdout | b64decode }}"

    - name: Get ArgoCD server service
      command: kubectl get svc argocd-server -n {{ argocd_namespace }}
      register: argocd_service

    - name: Display ArgoCD access information
      debug:
        msg: |
          ✓ ArgoCD installed successfully!
          
          Access ArgoCD:
          - Username: admin
          - Password: {{ argocd_admin_password }}
          
          To access ArgoCD UI:
          kubectl port-forward svc/argocd-server -n {{ argocd_namespace }} 8080:443
          
          Then visit: https://localhost:8080
          
          To login via CLI:
          argocd login localhost:8080 --username admin --password {{ argocd_admin_password }} --insecure
          
          {{ argocd_service.stdout }}
          
          ✓ Talos cluster fully bootstrapped and ready!

    - name: Create ArgoCD CLI config directory
      file:
        path: "~/.argocd"
        state: directory
        mode: '0755'

    - name: Save ArgoCD credentials
      copy:
        content: |
          ArgoCD Access Information
          =========================
          Username: admin
          Password: {{ argocd_admin_password }}
          Namespace: {{ argocd_namespace }}
          
          Access via port-forward:
          kubectl port-forward svc/argocd-server -n {{ argocd_namespace }} 8080:443
          
          URL: https://localhost:8080
        dest: "{{ config_dir }}/argocd-credentials.txt"
        mode: '0600'

    - name: Final summary
      debug:
        msg: |
          ================================================================================
          🎉 Kubernetes Cluster Bootstrap Complete! 🎉
          ================================================================================
          
          Cluster: {{ cluster_name }}
          Endpoint: https://{{ cluster_vip }}:6443
          
          Components Installed:
          ✓ TalosOS {{ hostvars['localhost']['talos_version'] | default('v1.11.5') }}
          ✓ Kubernetes {{ hostvars['localhost']['kubernetes_version'] | default('1.33.6') }}
          ✓ Cilium CNI
          ✓ ArgoCD {{ argocd_version }}
          
          Configuration Files:
          - Kubeconfig: ~/.kube/config
          - Talosconfig: ~/.talos/config
          - ArgoCD Credentials: {{ config_dir }}/argocd-credentials.txt
          
          Next Steps:
          1. Access ArgoCD UI (see credentials above)
          2. Deploy your applications via ArgoCD
          3. Configure GitOps repositories
          
          ================================================================================
