---
- name: Bootstrap Talos Kubernetes Cluster
  hosts: localhost
  gather_facts: false
  vars:
    talos_secrets_file: "{{ playbook_dir }}/../secrets/secrets.yaml"
    talos_config_dir: "{{ playbook_dir }}/../generated"
    talos_patches_dir: "{{ playbook_dir }}/../patches"
    talos_templates_dir: "{{ playbook_dir }}/../templates"
    max_reset_attempts: 2

  tasks:
    - name: Create required directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        mode: '0755'
      loop:
        - "{{ talos_config_dir }}"
        - "{{ playbook_dir }}/../secrets"
        - "{{ talos_patches_dir }}"

    - name: Generate Talos secrets
      ansible.builtin.command: talosctl gen secrets -o {{ talos_secrets_file }}
      args:
        creates: "{{ talos_secrets_file }}"

    - name: Create control plane patch files for each node
      ansible.builtin.template:
        src: "{{ talos_templates_dir }}/controlplane-patch.yaml.j2"
        dest: "{{ talos_patches_dir }}/controlplane-{{ item }}.yaml"
        mode: '0644'
      loop: "{{ groups['talos_control_plane'] }}"
      vars:
        node_ip: "{{ hostvars[item].talos_static_ip }}"
        node_name: "{{ item }}"
        cluster_name: "{{ hostvars[item].cluster_name }}"
        cluster_vip: "{{ hostvars[item].cluster_vip }}"
        gateway: "{{ hostvars[item].gateway }}"
        nameservers: "{{ hostvars[item].nameservers }}"

    - name: Create worker patch files for each node
      ansible.builtin.template:
        src: "{{ talos_templates_dir }}/worker-patch.yaml.j2"
        dest: "{{ talos_patches_dir }}/worker-{{ item }}.yaml"
        mode: '0644'
      loop: "{{ groups['talos_workers'] }}"
      vars:
        node_ip: "{{ hostvars[item].talos_static_ip }}"
        node_name: "{{ item }}"
        gateway: "{{ hostvars[item].gateway }}"
        nameservers: "{{ hostvars[item].nameservers }}"

    - name: Generate base Talos machine configs with Kubernetes {{ hostvars[groups['all'][0]].kubernetes_version }}
      ansible.builtin.command: >
        talosctl gen config {{ hostvars[groups['all'][0]].cluster_name }} https://{{ hostvars[groups['all'][0]].cluster_vip }}:6443
        --with-secrets {{ talos_secrets_file }}
        --kubernetes-version {{ hostvars[groups['all'][0]].kubernetes_version }}
        --output {{ talos_config_dir }}
      args:
        creates: "{{ talos_config_dir }}/controlplane.yaml"

