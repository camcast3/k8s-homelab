apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: l2-ippool
  namespace: kube-system
spec:
  blocks:
    - start: "192.168.86.30"
      stop: "192.168.86.100"   
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-announce
  namespace: kube-system
spec:
  interfaces:
    - ens18  # Replace with your node's interface (e.g., eth0, ens3)
  externalIPs: true
  loadBalancerIPs: true