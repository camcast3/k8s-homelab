apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui-route
  namespace: kube-system
spec:
  parentRefs:
    - name: argocd-gateway
      namespace: argocd
  hostnames: ["hubble.local"]
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
          namespace: kube-system